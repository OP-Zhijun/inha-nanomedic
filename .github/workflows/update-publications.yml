name: Update publications from Google Scholar

on:
  schedule:
    - cron: '0 0 * * 1'        # Mondays 09:00 KST (00:00 UTC)
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater (apply to working tree on this runner only)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_pubs_from_scholar.py --apply --report scholar_update_report.md

      - name: QA gate (must pass or no PR)
        run: python scripts/qa_check.py

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/publications-update
          base: main
          assignees: inha-nanomedic
          title: "Add new publications from Google Scholar"
          body-path: scholar_update_report.md
          commit-message: "chore: add new publications from Google Scholar"
          add-paths: |
            publication-patent.html
            index.html
          delete-branch: true
